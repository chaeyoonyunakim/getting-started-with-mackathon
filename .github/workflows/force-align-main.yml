name: Force align main
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact origin main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          mkdir -p /tmp/align && cd /tmp/align
          : > origin-main.bundle
          for asset in $(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api/releases/366546505/assets" | jq -r 'sort_by(.name)[] | .url'); do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$asset" >> origin-main.bundle
          done
          git clone origin-main.bundle exact
          cd exact
          test "$(git rev-parse refs/remotes/origin/main)" = "454e974c248421303e59ed672f8aa21bb02d654a"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin refs/remotes/origin/main:refs/heads/main
